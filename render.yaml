services:
  - type: web
    name: apex-elite-contractor-ai
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: VOICE_ENGINE
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      # Set your live keys in the Render dashboard:
      # - GEMINI_API_KEY
      # - TWILIO_ACCOUNT_SID
      # - TWILIO_AUTH_TOKEN
      # - TWILIO_FROM_NUMBER
