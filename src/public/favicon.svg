<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="apexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="60%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#06b6d4" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Sleek rounded gradient background tile -->
  <rect width="64" height="64" rx="16" fill="url(#apexGrad)" />
  
  <!-- Subtle inner border for crispness on light or dark browser tab bars -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />
  
  <!-- Apex Elite Mechanic & Voice Automation Emblem -->
  <g transform="translate(6, 6) scale(0.8125)">
    <!-- Wrench / Tool Path -->
    <path d="M40 16a2.5 2.5 0 0 0 0 3.5l3.5 3.5a2.5 2.5 0 0 0 3.5 0l6.5-6.5a14 14 0 0 1-18.5 18.5l-16 16a4.5 4.5 0 0 1-6.5-6.5l16-16a14 14 0 0 1 18.5-18.5l-7 6z" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glow)" />
          
    <!-- Central AI Pulse Spark / Dot -->
    <circle cx="16" cy="48" r="3.5" fill="#38bdf8" />
  </g>
